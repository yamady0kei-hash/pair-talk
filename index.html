<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ことばカード駅 iPadなめらか版</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color:#20334d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#d9f3ff,#fff4d4);min-height:100vh}.wrap{max-width:1040px;margin:auto;padding:22px 14px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:clamp(22px,4vw,36px);margin:0}.panel{background:#fff;border:3px solid #244d81;border-radius:18px;box-shadow:0 7px 0 #244d8130;padding:18px;margin-top:18px}.question{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;font-weight:900;font-size:clamp(23px,4.5vw,48px)}.wordbox{width:min(100%,390px);height:170px;position:relative;overflow:hidden;border:5px solid #24598e;border-radius:16px;background:#eaf4ff;flex-shrink:0}.wordbox:before,.wordbox:after{content:"";position:absolute;left:0;right:0;height:43px;z-index:2;pointer-events:none}.wordbox:before{top:0;background:linear-gradient(#eaf4ff,transparent)}.wordbox:after{bottom:0;background:linear-gradient(transparent,#eaf4ff)}.slot{position:absolute;left:0;right:0;top:0;will-change:transform}.item{height:80px;margin:0 8px;display:flex;justify-content:center;align-items:center;text-align:center;font-weight:900;font-size:clamp(28px,4.4vw,44px);color:#16395d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px;background:white;border:2px solid #9dc6e6;border-radius:10px}.item .card-check{width:27px;height:27px;flex:0 0 27px;accent-color:#1672c5;cursor:pointer;margin:0 4px 0 0}.item .card-word{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:center}.item .card-check:disabled{visibility:hidden}.item{gap:5px;padding:0 15px}.selection{position:absolute;left:3px;right:3px;top:40px;height:82px;border:4px solid #f5b500;border-radius:13px;z-index:3;pointer-events:none;box-shadow:0 0 0 2px #fff inset}.selection:before,.selection:after{content:'▶';position:absolute;top:24px;color:#e39d00;font-size:17px}.selection:before{left:-2px}.selection:after{content:'◀';right:-2px}.wordbox.done .selection{border-color:#e4a800;animation:flash .5s ease 2}@keyframes flash{50%{box-shadow:0 0 18px #ffd55a}}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:12px;background:#1465bc;color:white;padding:12px 20px;font-weight:800;font-size:17px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#55718b}.danger{background:#a44747}.status{text-align:center;min-height:30px;font-weight:700;margin-top:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{display:flex;gap:7px;align-items:center;flex-wrap:wrap}input[type=text],input[type=number],textarea,select{font:inherit;border:2px solid #a7bacd;border-radius:9px;padding:8px;max-width:100%}input[type=text]{width:170px}textarea{width:100%;min-height:90px}label{font-weight:650}details summary{cursor:pointer;font-weight:900;font-size:19px}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;margin-top:12px}.entry{display:flex;align-items:center;gap:8px;border:1px solid #d5e1ed;padding:9px;border-radius:10px;background:#f8fbff}.entry input[type=text]{width:100%;min-width:0;flex:1}.entry input[type=checkbox]{width:21px;height:21px;accent-color:#126ac0}.entry select{width:90px;padding:5px;font-size:13px}.hint{font-size:13px;color:#516779}.small{font-size:14px} .settings{display:grid;gap:12px;margin-top:14px} .pill{background:#f2f6fa;border-radius:8px;padding:8px}.hide{display:none}@media(max-width:580px){.wordbox{width:min(100%,330px)}.question{gap:8px}.panel{padding:13px}}

/* iPad / full-screen presentation mode */
html,body{width:100%;height:100%;overflow:hidden}body{min-height:100dvh}.wrap{width:100%;max-width:none;height:100dvh;padding:0;margin:0}#mainScreen{height:100%;min-height:0;display:flex;flex-direction:column;padding:clamp(10px,2.2vh,24px) clamp(12px,2vw,32px);gap:clamp(8px,2vh,20px)}header{flex:0 0 auto;min-height:48px}header h1{font-size:clamp(21px,3vw,38px)}#mainScreen>.panel{flex:1;min-height:0;margin:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:clamp(12px,3vh,30px);padding:clamp(12px,3vw,36px);overflow:auto}.question{width:100%;flex-wrap:wrap;gap:clamp(8px,2vw,28px);font-size:clamp(24px,4.3vw,58px)}.wordbox{width:clamp(230px,36vw,490px);max-width:100%;height:170px}.actions{margin-top:0}.actions button{font-size:clamp(18px,2vw,27px);padding:clamp(12px,1.7vh,22px) clamp(22px,3vw,42px)}.status{margin-top:0;min-height:1.5em}#settingsOverlay{position:fixed;inset:0;z-index:100;background:#edf5fd;overflow-y:auto;overscroll-behavior:contain;padding:clamp(12px,2vw,28px);padding-bottom:calc(24px + env(safe-area-inset-bottom));}#settingsOverlay.hide{display:none}.settingsTop{max-width:1050px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:15px;font-size:clamp(22px,3vw,32px);position:sticky;top:0;z-index:5;background:#edf5fd;padding:8px 0}#settingsOverlay>.panel,#settingsOverlay>.hint{max-width:1050px;margin:16px auto}body.modal-open{overflow:hidden}@media(max-width:700px){#mainScreen{padding:10px}#mainScreen>.panel{padding:12px}.question{flex-direction:column;flex-wrap:nowrap}.wordbox{width:min(100%,490px)}.actions button{font-size:17px;padding:12px 16px}}@media(max-height:550px) and (orientation:landscape){#mainScreen{gap:5px;padding:5px 12px}header{min-height:38px}header h1{font-size:22px}header button{padding:7px 12px}#mainScreen>.panel{gap:5px;padding:8px}.question{flex-direction:row;font-size:clamp(20px,3vw,36px)}.wordbox{height:155px;width:min(38vw,400px)}.wordbox .selection{top:32px}.actions button{padding:7px 18px;font-size:17px}.status{font-size:14px}} 
</style></head><body><div class="wrap"><main id="mainScreen"><header><h1 id="heading">🚉 ことばカード駅</h1><button class="secondary" id="settingsBtn">⚙ 設定</button></header><div class="panel"><div class="question"><span id="prefixDisplay">好きな</span><div class="wordbox" id="wordbox"><div class="slot" id="slot"></div><div class="selection"></div></div><span id="suffixDisplay">は？</span></div><div class="actions"><button id="start">▶ スタート</button><button class="secondary" id="reset">結果をクリア</button></div><div class="status" id="status" aria-live="polite">スタートを押してください</div></div></main><div id="settingsOverlay" class="hide" role="dialog" aria-modal="true" aria-label="設定"><div class="settingsTop"><strong>⚙ 設定</strong><button class="secondary" id="closeSettings">× 閉じる</button></div><div class="panel" id="settingsPanel"><details open><summary>✏️ 文章・カードを編集</summary><div class="settings"><div class="row"><label class="field">タイトル <input id="titleInput" type="text"></label><label class="field">前の文章 <input id="prefixInput" type="text"></label><label class="field">後の文章 <input id="suffixInput" type="text"></label></div><div><label>候補をまとめて追加（1行に1つ）</label><textarea id="bulk" placeholder="果物&#10;動物&#10;スポーツ"></textarea><div class="row"><button id="addBulk">候補を追加</button><button class="secondary" id="addOne">＋ 1件追加</button></div></div><div class="hint">カードの除外は下の一覧のチェックボックスで変更できます。「除外」にチェックしたカードは、チェックを外すまで出ません。抽選後に自動で除外することもできます。</div><div class="row"><label><input id="autoExclude" type="checkbox"> 出たカードを自動で除外</label><button class="secondary" id="uncheck">すべての除外を解除</button></div><div class="list" id="list"></div></div></details></div><div class="panel" id="advancedPanel"><details><summary>🎛 抽選の調整</summary><div class="settings"><div class="row"><label class="field">回転時間 <input type="number" id="duration" min="2" max="12" step="1" style="width:75px"> 秒</label></div><div class="hint">カードごとの「出やすさ」を設定できます。標準は1、3なら標準の約3倍の確率です（抽選可能なカード間で比較）。</div><div class="pill"><label class="field">次の1回だけ結果を指定 <select id="force"><option value="">指定しない（通常抽選）</option></select></label><p class="hint">指定したカードへ自然に減速して停止します。指定は1回で解除されます。除外中のカードは指定できません。</p></div></div></details></div><p class="hint">設定と除外チェックは、このブラウザに自動保存されます。オフラインで利用できます。</p></div></div><script>
(function(){'use strict';
const $=id=>document.getElementById(id),KEY='kotoba-station-v3';
let state={title:'ことばカード駅',prefix:'好きな',suffix:'は？',autoExclude:false,duration:7,cards:['果物','スポーツ','教科','動物','食べ物','色','季節','遊び'].map((word,i)=>({id:'c'+i,word,excluded:false,weight:1}))};
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.cards)){state={...state,...saved,cards:saved.cards.filter(c=>c&&typeof c.word==='string').map(c=>({id:String(c.id),word:c.word,excluded:!!c.excluded,weight:Math.max(0,Number(c.weight)||0)}))}}}catch(e){}
let spinning=false,chosen=null,forced='';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
function eligible(){return state.cards.filter(c=>!c.excluded&&c.word.trim()&&c.weight>0)}
function renderText(){ $('heading').textContent='🚉 '+state.title;$('prefixDisplay').textContent=state.prefix;$('suffixDisplay').textContent=state.suffix;}
function renderCard(card){const d=document.createElement('div');d.className='item';const name=document.createElement('span');name.className='card-word';name.textContent=card?card.word:'？？？';d.append(name);return d}
function idle(card){const slot=$('slot');slot.replaceChildren(renderCard(card));slot.style.transition='none';slot.style.transform='translateY(41px)';}
function refreshForce(){const select=$('force'),old=forced;select.replaceChildren(new Option('指定しない（通常抽選）',''));eligible().forEach(c=>select.add(new Option(c.word,c.id)));if(eligible().some(c=>c.id===old)){select.value=old}else{forced='';select.value=''}}
function renderList(){const root=$('list');root.replaceChildren();state.cards.forEach(c=>{const r=document.createElement('div');r.className='entry';const ck=document.createElement('input');ck.type='checkbox';ck.checked=c.excluded;ck.title='抽選から除外';ck.setAttribute('aria-label',c.word+'を除外');ck.onchange=()=>{c.excluded=ck.checked;save();refreshForce();updateStatus()};const name=document.createElement('input');name.type='text';name.value=c.word;name.setAttribute('aria-label','カード名');name.onchange=()=>{c.word=name.value;save();refreshForce();if(!spinning&&!chosen)idle(null)};const weight=document.createElement('select');[0,1,2,3,5,10].forEach(v=>weight.add(new Option('倍率 '+v,v)));weight.value=String(c.weight);weight.title='出やすさ';weight.onchange=()=>{c.weight=Number(weight.value);save();refreshForce();updateStatus()};const del=document.createElement('button');del.className='danger';del.textContent='×';del.title='削除';del.style.padding='6px 10px';del.onclick=()=>{if(spinning)return;state.cards=state.cards.filter(x=>x.id!==c.id);if(chosen&&chosen.id===c.id){chosen=null;idle(null)}save();renderList();refreshForce();updateStatus()};r.append(ck,name,weight,del);root.append(r)})}
function updateStatus(){if(spinning)return;const n=eligible().length;$('status').textContent=chosen?'決定：'+chosen.word:'スタートを押してください';$('start').disabled=n===0}
function pick(pool){const total=pool.reduce((a,c)=>a+c.weight,0);let r=Math.random()*total;for(const c of pool){r-=c.weight;if(r<0)return c}return pool[pool.length-1]}
function delay(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
// Animate each card through the full 80px travel distance, with a frame to paint the start state.
function slideCard(from,to,ms){return new Promise(resolve=>{const slot=$('slot');slot.replaceChildren(renderCard(from),renderCard(to));slot.style.transition='none';slot.style.transform='translate3d(0,41px,0)';// Force the browser to register the starting position before animating.
void slot.offsetHeight;requestAnimationFrame(()=>requestAnimationFrame(()=>{slot.style.transition=`transform ${ms}ms linear`;slot.style.transform='translate3d(0,-39px,0)';setTimeout(resolve,ms+38)}))})}
async function spin(){
 if(spinning)return;
 const pool=eligible();if(!pool.length){$('status').textContent='抽選できるカードがありません。除外を解除してください。';return}
 spinning=true;chosen=null;$('start').disabled=true;$('reset').disabled=true;$('wordbox').classList.remove('done');$('status').textContent='抽選中…';
 const result=pool.find(c=>c.id===forced)||pick(pool);forced='';$('force').value='';
 const duration=Math.max(2,Math.min(12,Number(state.duration)||7))*1000;
 // Visible iPad-friendly travel: minimum 155ms per card, gradually increasing to 600ms.
 // Pre-plan enough whole steps to fill the chosen duration without a rapid final jump.
 const steps=Math.max(5,Math.round(duration/300));
 let current=pool[Math.floor(Math.random()*pool.length)];idle(current);
 for(let i=0;i<steps;i++){
   const t=(i+1)/steps;
   const weight=0.58+1.75*Math.pow(t,2.5);
   // Sum of the easing weights determines an exact overall duration.
   let total=0;for(let j=0;j<steps;j++)total+=0.58+1.75*Math.pow((j+1)/steps,2.5);
   const ms=Math.max(130,Math.round(duration*weight/total)-38);
   let next;
   if(i===steps-1)next=result;
   else {next=pool[Math.floor(Math.random()*pool.length)];if(pool.length>1&&next.id===current.id)next=pool[(pool.indexOf(next)+1)%pool.length]}
   await slideCard(current,next,ms);current=next;
 }
 idle(result);chosen=result;$('wordbox').classList.add('done');
 if(state.autoExclude){result.excluded=true;renderList()}
 save();refreshForce();spinning=false;$('reset').disabled=false;updateStatus();
}
$('start').onclick=spin;$('reset').onclick=()=>{if(spinning)return;chosen=null;idle(null);$('wordbox').classList.remove('done');updateStatus()};const overlay=$('settingsOverlay');function openSettings(){if(spinning)return;overlay.classList.remove('hide');document.body.classList.add('modal-open');$('closeSettings').focus()}function closeSettings(){overlay.classList.add('hide');document.body.classList.remove('modal-open');$('settingsBtn').focus()}$('settingsBtn').onclick=openSettings;$('closeSettings').onclick=closeSettings;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.classList.contains('hide'))closeSettings()});
[['titleInput','title'],['prefixInput','prefix'],['suffixInput','suffix']].forEach(([id,key])=>{$(id).value=state[key];$(id).oninput=()=>{state[key]=$(id).value;renderText();save()}});$('duration').value=state.duration;$('duration').onchange=()=>{state.duration=Math.max(2,Math.min(12,Number($('duration').value)||5));$('duration').value=state.duration;save()};$('autoExclude').checked=state.autoExclude;$('autoExclude').onchange=()=>{state.autoExclude=$('autoExclude').checked;save()};$('uncheck').onclick=()=>{if(spinning)return;state.cards.forEach(c=>c.excluded=false);save();renderList();refreshForce();updateStatus()};$('addOne').onclick=()=>{if(spinning)return;state.cards.push({id:'c'+Date.now()+Math.random(),word:'新しいカード',excluded:false,weight:1});save();renderList();refreshForce();updateStatus()};$('addBulk').onclick=()=>{if(spinning)return;const words=$('bulk').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);words.forEach((word,i)=>state.cards.push({id:'c'+Date.now()+i+Math.random(),word,excluded:false,weight:1}));$('bulk').value='';save();renderList();refreshForce();updateStatus()};$('force').onchange=()=>{forced=$('force').value};renderText();renderList();refreshForce();idle(null);updateStatus();
})();
</script></body></html>
